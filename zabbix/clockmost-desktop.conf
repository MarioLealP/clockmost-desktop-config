# clockmost desktop checks (values: /usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh; Zabbix side:
# clockmost-infra ops/zabbix/zbx23). The agent's Server/ServerActive/Hostname stay in zabbix_agent2.conf (per machine).
UserParameter=desktop.backup.failed,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh backup-failed
UserParameter=desktop.backup.at,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh backup-at
UserParameter=desktop.gdrive.failed,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh gdrive-failed
UserParameter=desktop.gdrive.last_ok,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh gdrive-last-ok
UserParameter=desktop.units.failed,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh units-failed
UserParameter=desktop.updates.pending,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh updates
UserParameter=desktop.btrfs.errors,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh btrfs-errors
UserParameter=desktop.smart.unhealthy,/usr/lib/clockmost-desktop-config/zabbix-desktop-check.sh smart-unhealthy
